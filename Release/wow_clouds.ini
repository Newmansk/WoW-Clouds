; wow_clouds.ini - reloads itself every second when the file is saved (no need to restart the game)
[Clouds]
LuaBridge=1
Enabled=1
; 1 = paints the sky magenta. Useful to check that the drawing only covers the sky
TestMode=0
; 1 = writes a detailed log to wow_clouds.log
Debug=0

; ---------------------------------------------------------------------------
; Global rendering settings -- shared by all 3 layers, not per-layer
; ---------------------------------------------------------------------------
; 1 = clouds are drawn at the same point in the frame as the original ones (sky): always behind
; terrain, distant mountains, and everything else.
; 0 = at the end of the world, only where nothing was drawn yet (may show in front of very distant mountains)
Layer=1
; 1 = clouds also write the alpha channel (normally leave at 0)
WriteAlpha=0
; World "up" axis: 0=X 1=Y 2=Z. If the clouds come out sideways or on the ground, try 0/1/2 and UpSign=-1
UpAxis=2
UpSign=1
; Quad depth. 1.0 = only where nothing was drawn yet
QuadDepth=1.0
; 1.0 = full resolution (previous behavior). Below 1.0, all 3 cloud layers are rendered into a
; smaller offscreen buffer (this fraction of your real resolution) and stretched back onto the
; screen -- cuts GPU cost, at some loss of sharpness in the clouds (and a very slight blur across
; the rest of the sky, from the down+up round trip). Only testing this on the main sky-phase draw.
RenderScale=1

; Light (fixed sun direction in this first version) -- also shared by all 3 layers
SunAzimuth=45
SunElevation=50
SunColor=1.00,0.97,0.90
ShadowColor=0.60,0.66,0.80
NightBrightness=0.16

; ---------------------------------------------------------------------------
; Color of the new clouds and the original clouds
; ---------------------------------------------------------------------------
; Where the cloud color comes from:
;   0 = fixed (SunColor / ShadowColor)
;   1 = sampling of the already-rendered sky (depends on where you're looking)
;   2 = vertex color of CloudDraws   3 = TEXTUREFACTOR of that call   4 = material of that call
;   5 = vertex color of the sky gradient (SkyColorDraw), changes with time of day [default]
ColorSource=5
; With ColorSource=1: how much tint (0-1) and between which sky luminances it goes from night to day
TintMix=0.7
SkyLumNight=0.08
SkyLumDay=0.8
SkySampleEvery=12
; With ColorSource=2/3/4: color multiplier
ColorGain=1.5

; 1 = dumps the sky-phase draw calls to wow_clouds.log (several seconds in-game)
SkyDump=0
; The original clouds are identified by their geometry: a 372-triangle textured dome (your capture).
; Don't use draw-order numbers: they change from day to night depending on which celestial bodies are visible.
; (CloudDraws is only used if CloudPrims=0)
CloudPrims=372
CloudDraws=
; 1 = don't draw the CloudDraws calls (hides the original clouds). Hot-reloadable.
HideOriginalClouds=1
; Minimum brightness of the cloud color (0-1). Keeps them from looking black at night
MinLit=0.12

; The sky color comes from the gradient: a 298-triangle untextured mesh (SkyColorDraw is only used if SkyColorPrims=0)
SkyColorPrims=298
SkyColorDraw=1
; 1 = logs, every ~0.5s, the vertex color of the 3 sky draw calls (to see how they change with time of day).
; Already calibrated with this, can be left at 0. Set back to 1 if recalibration is needed.
ColorTrace=0

; ---------------------------------------------------------------------------
; Weather detection by rate of change of the sky color
; ---------------------------------------------------------------------------
; Seconds it takes the "baseline" to catch up to the real sky color.
; Should be noticeably longer than how long rain takes to darken the sky (~10s measured),
; and noticeably shorter than the full day/night cycle, so one triggers the detector and the other doesn't.
WxBaselineTau=90
; How dark (relative to the baseline) the sky must get to consider it raining.
; With rain we measured a drop of ~0.14 in luminance; 0.07 leaves plenty of margin.
WxDevEnter=0.07
; Below this value it's considered clear again (must be lower than WxDevEnter)
WxDevExit=0.03
; Seconds the candidate must hold before confirming the weather change
WxConfirmSec=1.0
; If the sky color changes faster than this (luminance per second, measured frame to frame),
; it's considered an external jump (e.g. a mod that sets the time of day instantly) and does NOT count as weather.
; Real measured rain changes at most ~0.02/s, so 0.15 leaves a lot of margin.
WxJumpRate=0.15
; Minimum seconds between comparisons for the sudden-jump check. Prevents single-frame noise
; (at high fps, a tiny dt) from being misread as a huge jump.
WxJumpWindow=0.25
; 1 = logs, every 60 frames, the baseline, the real color, and the detected state
WxLog=0
; 1 = use the main detector: CMapWeather effect slots (+0x28 rain, +0x2c snow,
; +0x30 sandstorm), confirmed with Cheat Engine. They hold on their own, no pulse to remember,
; and also work when coming out of clear weather (unlike +0x20).
WxUseSlots=1
; Fallback: the +0x20 pulse. Only used if the slot detector can't read the manager.
WxUsePulse=1

; ---------------------------------------------------------------------------
; Active weather (rain, snow and sandstorm alike): how the clouds change
; ---------------------------------------------------------------------------
; Cloud coverage and opacity during active weather (0-1), replace Coverage/Opacity.
; Raised from 0.95 to 1.0 (full coverage) on request.
RainCoverage=1.2
RainOpacity=1.0
; 1 = no color change, lower = darker during active weather
RainDarken=1
; Transition speed (per second). Approximate time = 1 / this value
; 0.15 = about 6.7 seconds, 0.20 = 5 seconds, 0.125 = 8 seconds
RainBlendSpeed=0.05

; ---------------------------------------------------------------------------
; Extra daytime transparency (clear weather only)
; ---------------------------------------------------------------------------
; Uses the same real sky color and the same SkyLumNight/SkyLumDay thresholds (see above)
; already used by the nighttime cloud darkening, so it stays automatically in sync with
; that; no separate time-of-day setting needed.
DayTransparencyEnabled=1
; 0.30 = clouds 30% more transparent during clear daytime weather
DayTransparencyAmount=0.30

; ---------------------------------------------------------------------------
; Zone presets (by AreaId): logging and blend-speed settings
; ---------------------------------------------------------------------------
AreaLog=0
PresetLog=0
; Multiplies the blend speed for the transition between area/zone (lower to make it slower)
ZoneCoverageBlendSpeed=0.02
; Same idea, but for TintMix and WeatherBlendSpeedMult (see those keys below, per preset)
ZoneTintMixBlendSpeed=0.6
ZoneWeatherBlendSpeedMultBlendSpeed=0.6

; ---------------------------------------------------------------------------
; Layer 1 (the original/base layer): shape and look. Always on. Kept at the
; end of [Clouds] on purpose, right next to [CloudsLayer2]/[CloudsLayer3]
; below -- everything above this point is global/shared and doesn't change
; per layer, so this is the part you'll actually be comparing against them.
; ---------------------------------------------------------------------------
Scale=3
Coverage=0.45
; Softness of the cloud edges. Lower = sharper edges (self-antialiases to ~1 pixel)
Softness=0.05
Opacity=1.3
HorizonFade=0.30
; 0 = flat (clouds stretched a lot toward the horizon), 0.3-0.6 = rounder
Dome=0.05
; Cloud drift (noise units per second)
WindX=0.060
WindY=0.024
; Global speed of all movement (wind + shape change). 1 = normal, 2 = double...
TimeScale=0.1
; How much the cloud SHAPE changes over time (0 = they only drift, no deforming)
Evolve=0.50
; Fine detail: weight of the small noise octaves. More = sharper edges and textures (try 1.0-2.5)
Detail=1
; Sharpness of the 3-tone shading. Lower = more marked bands (cel-shading style)
BandSoftness=0.08

DumpNow=0

; ---------------------------------------------------------------------------
; Layers 2 and 3 (depth): optional, each in its own section, both start OFF
; (Enabled=0) so nothing changes until you turn them on. Idea: layer 1 above
; is the farthest/biggest with high coverage, layer 2 a bit closer/smaller
; with medium coverage, layer 3 the closest/smallest with light coverage.
; They're drawn in that order (1 -> 2 -> 3), so closer layers paint over
; farther ones where they overlap, the same way the clouds already paint over
; the sky gradient behind them.
;
; Weather (rain/snow/sandstorm) and zone presets (Darken/CoverageAdd/etc.,
; further down in this file) affect all 3 layers together, using layer 1's
; values above as the reference -- you don't set those up separately per layer.
;
; Each layer accepts the same keys as layer 1 above, except Enabled/TestMode/
; Debug/the sun direction/QuadDepth/etc., which are global (see the top of
; this file) and shared by all layers. One extra key only these layers have:
;   NoiseSeed   offsets this layer's cloud shapes so they don't look like an
;               exact copy of the other layers at a different scale/speed.
;               Any two different numbers work; these defaults were just
;               picked arbitrarily to be far apart.
; ---------------------------------------------------------------------------
[CloudsLayer2]
Enabled=1
Scale=2.0
Coverage=0.6
Opacity=1.0
Softness=0.04
HorizonFade=0.3
Dome=0.05
WindX=0.065
WindY=0.026
TimeScale=0.20
Evolve=0.20
Detail=0.9
BandSoftness=0.06
NoiseSeed=44
RainCoverage=0.8
RainOpacity=1.0

[CloudsLayer3]
Enabled=1
Scale=1.5
Coverage=0.6
Opacity=0.8
Softness=0.1
HorizonFade=0.1
Dome=0.1
WindX=0.035
WindY=0.018
TimeScale=0.2
Evolve=0.5
Detail=1.5
BandSoftness=0.05
NoiseSeed=98
RainCoverage=0.6
RainOpacity=0.8

; Zone presets section
; You can add custom presets for any area you want, you only have to add the areas id
; I have set some default presets for most zones in the version 1.18.1
;
; Two optional per-preset keys, both default to "no change" when omitted:
;   TintMix=0..1                 overrides the global TintMix while in this zone (how much the
;                                 clouds tint toward the real sky color vs. SunColor/ShadowColor)
;   WeatherBlendSpeedMult=1.0     multiplies RainBlendSpeed while in this zone (>1 = weather
;                                 transitions kick in faster here, <1 = slower)
[Preset:Volcanic]
AreaIds=46,51,25
Darken=0.6
SpeedMult=1.0
CoverageAdd=0.1
TintMix=0.8
WeatherBlendSpeedMult=1.5

